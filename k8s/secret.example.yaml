# ==============================================================================
# DevHub Kubernetes Secret Template
# ==============================================================================
# IMPORTANT SECURITY LESSON:
# Base64 encoding is an encoding scheme, NOT encryption!
# Anyone with access to read Secrets can easily decode these values.
#
# To create this secret for your kind cluster:
#   Windows PowerShell: Copy-Item k8s/secret.example.yaml k8s/secret.yaml
#   Linux / macOS:      cp k8s/secret.example.yaml k8s/secret.yaml
# Then apply:
#   kubectl apply -f k8s/secret.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: devhub-secret
  namespace: devhub
  labels:
    app.kubernetes.io/name: devhub
type: Opaque
stringData:
  POSTGRES_USER: "devhub"
  POSTGRES_PASSWORD: "devhub_k8s_secure_workshop_pass"
  DATABASE_URL: "postgresql+psycopg2://devhub:devhub_k8s_secure_workshop_pass@postgres:5432/devhub_db"
